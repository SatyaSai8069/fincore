services:
  postgres:
    image: postgres:16-alpine
    container_name: finora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finora_user
      POSTGRES_PASSWORD: finora_dev_pass
      POSTGRES_DB: finora_db
    ports:
      - "5432:5432"
    volumes:
      - finora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finora_user -d finora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - finora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finora_pg_data:
  finora_redis_data: